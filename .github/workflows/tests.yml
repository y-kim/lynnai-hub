# 시험: Home Assistant 통합(pytest, 가짜 허브), SmartThings 드라이버 시뮬레이터(lupa), NAS 허브 명령·폴백
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component
      - run: pytest -q tests/ha

  driver-and-nas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: python edge-driver/test/run_sim.py
      - run: python server/lynnai-nas/test_commands.py
      - run: python server/lynnai-nas/test_fallback.py
