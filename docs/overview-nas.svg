<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 322" width="960" role="img"
     aria-label="NAS 허브 구성도: 보일러 조절기(WF-S6000 등)와 온도 조절기(RICH-WCR(N) 등)가 집 Wi-Fi 로 공유기에 붙는다. 공유기는 DHCP 로 DNS 서버를 NAS 로 알려 준다. NAS(Docker)에는 DNS 서버와 LYNNAI 허브가 같이 돌고 공유기에 유선 LAN 으로 붙어 있다 — DNS 서버는 린나이 기기가 rkiot.net 을 물으면 NAS 주소로 답해 기기가 클라우드 대신 허브로 오게 한다. 공유기는 인터넷으로 린나이 클라우드에(프록시 모드), LAN 으로 SmartThings 허브를 거쳐 SmartThings 앱에 이어진다">
  <title>lynnai-hub 구성도 (NAS 허브)</title>
  <style>
    .bg    { fill: #ffffff; stroke: #d0d7de; }
    .box   { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .hub   { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .opt   { stroke-dasharray: 6 4; }
    .group { fill: none; stroke: #8c959f; stroke-width: 1.2; }
    .line  { fill: none; stroke: #57606a; stroke-width: 1.5; }
    .head  { fill: #57606a; }
    text   { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
             font-size: 14px; fill: #1f2328; text-anchor: middle; }
    .name  { font-weight: 600; }
    .sub   { font-size: 12px; fill: #57606a; }
    .via   { font-size: 12.5px; fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; stroke: #30363d; }
      .box  { fill: #161b22; stroke: #8b949e; }
      .hub  { fill: #0c2d6b; stroke: #58a6ff; }
      .group { stroke: #6e7681; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      text  { fill: #e6edf3; }
      .sub, .via { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="321" rx="10"/>

  <!-- 린나이 기기 -->
  <rect class="box" x="24" y="42" width="156" height="56" rx="8"/>
  <text class="name" x="102" y="66">보일러 조절기</text>
  <text class="sub" x="102" y="85">WF-S6000 등</text>
  <rect class="box" x="24" y="114" width="156" height="56" rx="8"/>
  <text class="name" x="102" y="138">온도 조절기</text>
  <text class="sub" x="102" y="157">RICH-WCR(N) 등</text>

  <!-- 기기 → 공유기 (집 Wi-Fi) -->
  <path class="line" d="M180 70 H328" marker-end="url(#arrow)"/>
  <path class="line" d="M180 142 H328" marker-end="url(#arrow)"/>
  <text class="via" x="254" y="110">집 Wi-Fi</text>

  <!-- 공유기: DHCP 가 나눠 주는 DNS 서버를 NAS 로 바꿔 둔다 -->
  <rect class="box" x="330" y="52" width="170" height="108" rx="8"/>
  <text class="name" x="415" y="103">공유기</text>
  <text class="sub" x="415" y="123">DHCP: DNS 서버 = NAS</text>

  <!-- 공유기 ↔ NAS -->
  <path class="line" d="M415 162 V202" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="via" x="456" y="187">유선 LAN</text>

  <!-- NAS (Docker): DNS 서버 + 허브 -->
  <rect class="group" x="236" y="204" width="358" height="98" rx="10"/>
  <text class="via" x="415" y="223">NAS (Docker)</text>
  <rect class="box" x="248" y="232" width="160" height="58" rx="8"/>
  <text class="name" x="328" y="257">DNS 서버</text>
  <text class="sub" x="328" y="276">rkiot.net → NAS 주소</text>
  <rect class="hub" x="422" y="232" width="160" height="58" rx="10"/>
  <text class="name" x="502" y="257" style="font-size:15px">LYNNAI 허브</text>
  <text class="sub" x="502" y="276">클라우드 대신 받음</text>

  <!-- 공유기 → 린나이 클라우드 (프록시 모드에서만) -->
  <path class="line opt" d="M500 88 H770" marker-end="url(#arrow)"/>
  <text class="via" x="636" y="79">인터넷</text>
  <rect class="box opt" x="772" y="58" width="164" height="60" rx="8"/>
  <text class="name" x="854" y="84">린나이 클라우드</text>
  <text class="sub" x="854" y="103">프록시 모드</text>

  <!-- 공유기 → SmartThings -->
  <path class="line" d="M500 130 H695 V235" marker-end="url(#arrow)"/>
  <text class="via" x="598" y="121">LAN</text>
  <rect class="box" x="620" y="237" width="150" height="48" rx="8"/>
  <text class="name" x="695" y="266">SmartThings 허브</text>
  <path class="line" d="M770 261 H798" marker-end="url(#arrow)"/>
  <rect class="box" x="800" y="237" width="136" height="48" rx="8"/>
  <text class="name" x="868" y="266">SmartThings 앱</text>
</svg>
