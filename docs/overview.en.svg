<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 272" width="960" role="img"
     aria-label="ESP32 hub overview: the boiler controller (e.g. WF-S6000) and the room thermostat (e.g. RICH-WCR(N)) join the LYNNAI hub (ESP32-C6) over the Wi-Fi AP the hub provides. The hub connects through home Wi-Fi to the router, and the router reaches the Rinnai cloud over the internet (proxy mode only). The hub also links over Zigbee to the SmartThings hub and on to the SmartThings app">
  <title>lynnai-hub overview (ESP32 hub)</title>
  <style>
    .bg    { fill: #ffffff; stroke: #d0d7de; }
    .box   { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .hub   { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .opt   { stroke-dasharray: 6 4; }
    .line  { fill: none; stroke: #57606a; stroke-width: 1.5; }
    .head  { fill: #57606a; }
    text   { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
             font-size: 14px; fill: #1f2328; text-anchor: middle; }
    .name  { font-weight: 600; }
    .sub   { font-size: 12px; fill: #57606a; }
    .via   { font-size: 12.5px; fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; stroke: #30363d; }
      .box  { fill: #161b22; stroke: #8b949e; }
      .hub  { fill: #0c2d6b; stroke: #58a6ff; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      text  { fill: #e6edf3; }
      .sub, .via { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="271" rx="10"/>

    <rect class="box" x="24" y="42" width="156" height="56" rx="8"/>
  <text class="name" x="102" y="66">Boiler controller</text>
  <text class="sub" x="102" y="85">e.g. WF-S6000</text>
  <rect class="box" x="24" y="114" width="156" height="56" rx="8"/>
  <text class="name" x="102" y="138">Room thermostat</text>
  <text class="sub" x="102" y="157">e.g. RICH-WCR(N)</text>

    <path class="line" d="M180 70 H328" marker-end="url(#arrow)"/>
  <path class="line" d="M180 142 H328" marker-end="url(#arrow)"/>
  <text class="via" x="254" y="110">Wi-Fi (hub AP)</text>

    <rect class="hub" x="330" y="52" width="170" height="108" rx="10"/>
  <text class="name" x="415" y="103" style="font-size:15px">LYNNAI hub</text>
  <text class="sub" x="415" y="123">ESP32-C6</text>

    <path class="line" d="M500 106 H588" marker-end="url(#arrow)"/>
  <text class="via" x="544" y="97">Home Wi-Fi</text>
  <rect class="box" x="590" y="82" width="100" height="48" rx="8"/>
  <text class="name" x="640" y="111">Router</text>

    <path class="line opt" d="M690 106 H770" marker-end="url(#arrow)"/>
  <text class="via" x="729" y="97">Internet</text>
  <rect class="box opt" x="772" y="76" width="164" height="60" rx="8"/>
  <text class="name" x="854" y="102">Rinnai cloud</text>
  <text class="sub" x="854" y="121">proxy mode</text>

    <path class="line" d="M415 160 V214 H563" marker-end="url(#arrow)"/>
  <text class="via" x="489" y="205">Zigbee</text>
  <rect class="box" x="565" y="190" width="150" height="48" rx="8"/>
  <text class="name" x="640" y="219">SmartThings hub</text>
  <path class="line" d="M715 214 H798" marker-end="url(#arrow)"/>
  <rect class="box" x="800" y="190" width="136" height="48" rx="8"/>
  <text class="name" x="868" y="219">SmartThings app</text>
</svg>
