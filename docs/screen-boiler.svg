  <path class="icon" style="stroke:#14161a" d="M316 120v8M311.2 122.8a7 7 0 1 0 9.600 0"/>
  <text class="t-sec" x="22" y="184">난방</text>
  <path class="icon-m" transform="translate(326 172)" d="M0 11.500V14h2.500l7.400-7.400-2.500-2.500L0 11.500Zm11.800-6.800a.660.660 0 0 0 0-.900L10.200 2.200a.660.660 0 0 0-.900 0L8.100 3.400l2.500 2.500 1.200-1.200Z"/>
  <rect class="on" x="14" y="196" width="332" height="56" rx="28"/>
  <text class="t-pill t-on" x="36" y="231">켜짐</text>
  <circle class="btn-on" cx="316" cy="224" r="19"/>
  <path class="icon" style="stroke:#14161a" d="M316 216v8M311.2 218.8a7 7 0 1 0 9.600 0"/>
  <rect class="card" x="14" y="262" width="332" height="182" rx="22"/>
  <text class="t-name" x="34" y="289">온도조절 모드</text>
  <text class="t-val" x="34" y="319">온돌</text>
  <path class="ink" d="M88 307h9l-4.500 6z"/>
  <path class="rule" d="M34 336H326"/>
  <text class="t-name" x="34" y="363">난방 온도 설정</text>
  <text class="t-val" x="34" y="393">70.0</text><text class="t-unit" x="84" y="393">°C</text>
  <circle class="knob-h" cx="44" cy="420" r="10"/><text class="t-pm" x="44" y="425">−</text>
  <path class="track" d="M64 420H296"/><path class="heat" d="M64 420H226"/><circle class="knob-h" cx="226" cy="420" r="12"/>
  <g class=""><circle class="knob-h" cx="316" cy="420" r="10"/><text class="t-pm" x="316" y="425">+</text></g>
  <text class="t-sec" x="22" y="472">외출</text>
  <path class="icon-m" transform="translate(326 460)" d="M0 11.500V14h2.500l7.400-7.400-2.500-2.500L0 11.500Zm11.800-6.800a.660.660 0 0 0 0-.900L10.200 2.200a.660.660 0 0 0-.900 0L8.100 3.400l2.500 2.500 1.200-1.200Z"/>
  <rect class="idle" x="14" y="484" width="332" height="56" rx="28"/>
  <text class="t-pill" x="36" y="519">꺼짐</text>
  <circle class="btn" cx="316" cy="512" r="19"/>
  <path class="icon" d="M316 504v8M311.2 506.8a7 7 0 1 0 9.600 0"/>
  <text class="t-sec" x="22" y="568">온수</text>
  <path class="icon-m" transform="translate(326 556)" d="M0 11.500V14h2.500l7.400-7.400-2.500-2.500L0 11.500Zm11.800-6.800a.660.660 0 0 0 0-.900L10.200 2.200a.660.660 0 0 0-.900 0L8.100 3.400l2.500 2.500 1.200-1.200Z"/>
  <rect class="on" x="14" y="580" width="332" height="56" rx="28"/>
  <text class="t-pill t-on" x="36" y="615">켜짐</text>
  <circle class="btn-on" cx="316" cy="608" r="19"/>
  <path class="icon" style="stroke:#14161a" d="M316 600v8M311.2 602.8a7 7 0 1 0 9.600 0"/>
