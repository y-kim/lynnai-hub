  <text class="t-name" x="34" y="673">수온 설정</text>
  <text class="t-val" x="34" y="703">60.0</text><text class="t-unit" x="84" y="703">°C</text>
  <circle class="knob-h" cx="44" cy="730" r="10"/><text class="t-pm" x="44" y="735">−</text>
  <path class="track" d="M64 730H296"/><path class="heat" d="M64 730H296"/><circle class="knob-h" cx="296" cy="730" r="12"/>
  <g class="dim"><circle class="knob-h" cx="316" cy="730" r="10"/><text class="t-pm" x="316" y="735">+</text></g>
  <text class="t-sec" x="22" y="782">온수 예열</text>
  <path class="icon-m" transform="translate(326 770)" d="M0 11.500V14h2.500l7.400-7.400-2.500-2.500L0 11.500Zm11.800-6.800a.660.660 0 0 0 0-.900L10.200 2.200a.660.660 0 0 0-.900 0L8.100 3.400l2.500 2.500 1.200-1.200Z"/>
