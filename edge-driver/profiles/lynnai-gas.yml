name: lynnai-gas
# 기기 화면 구성(device-config, 아래 vid):
#   - 팝업·기기 카드: 글자 요약(boilerStatus, "1D … · 1H …")
#   - 상세 화면: 사용량(24시간·1시간·이번달) → 계량기 지침 → 유량 → 요금(이번달 예상 금액·지난 24시간 요금) → 새로고침. 글자 요약은 상세 화면에서 뺐다.
#   - 표준 gasMeter 카드의 제목 "가스 계량기"를 "계량기 지침"으로 바꿨다(patch /0/label).
# 화면 구성은 만든 순간의 카드 모습이 그대로 굳는다 — 구역·capability 를 바꾸거나 capability 의 표시(presentation)를
# 고치면 다시 만들어 vid 를 바꿔야 한다(안 그러면 앱이 옛 모습과 새 모습을 번갈아 보여 준다):
#   smartthings presentation:device-config:create -i <구성 json>  → 나온 presentationId 를 아래 vid 에.
metadata:
  mnmn: SmartThingsCommunity
  vid: fa90aafc-c920-3321-adff-441e616cc436
components:
  # 구역은 main 하나(여럿이면 앱이 구역마다 제목 줄을 붙인다). 순서가 상세 화면의 타일 순서다.
  - id: main
    capabilities:
      - id: connectbook02461.boilerStatus   # 글자 요약(1D · 1H) — 팝업·기기 카드용. 상세 화면에서는 뺀다(vid)
        version: 1
      - id: connectbook02461.gasUse         # 사용량: 24시간 · 1시간 · 이번달
        version: 1
      - id: gasMeter                        # 계량기 지침
        version: 1
      - id: connectbook02461.gasFlow        # 유량
        version: 1
      - id: connectbook02461.gasCost        # 요금: 이번달 예상 금액 · 지난 24시간 요금
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: GasMeter
preferences:
  - name: gasApiBase
    title: 요금 자동 조회 주소 (LAN)
    description: 비우면 아래 수동값 사용. 예 http://192.168.0.10:8496 (gas-heat-logger LAN). Edge 는 공개 인터넷 불가 — LAN 주소만
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 64
      default: ""
  - name: gasRegion
    title: 구역 코드
    description: 자동 조회용 구역(예 SD07=경기 중부1 코원). 목록 /api/regions
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 8
      default: SD07
  - name: gasVcf
    title: 온압보정계수 (수동)
    description: 자동 조회 꺼짐·실패 시 사용. 청구서 '보정계수'
    required: false
    preferenceType: number
    definition:
      minimum: 0.9
      maximum: 1.1
      default: 0.9939
  - name: gasHeat
    title: 열량계수 (수동, MJ/N㎥)
    description: 자동 조회 꺼짐·실패 시 사용. 청구서 '열량계수'
    required: false
    preferenceType: number
    definition:
      minimum: 30
      maximum: 50
      default: 42.576
  - name: gasRate
    title: 단가 (수동, 원/MJ)
    description: 자동 조회 꺼짐·실패 시 사용. 주택난방 단가(부가세 별도)
    required: false
    preferenceType: number
    definition:
      minimum: 0
      maximum: 100
      default: 22.6226
  - name: gasBaseFee
    title: 기본료 (원/월)
    description: 월 기본요금(부가세 별도)
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 100000
      default: 1250
  - name: gasBillDay
    title: 검침일 (1-28)
    description: 가스 검침일. 이번 달 사용량·요금을 이 날 기준으로 센다
    required: false
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 28
      default: 8
  - name: gasVat
    title: 부가세 10% 포함
    required: false
    preferenceType: boolean
    definition:
      default: true
