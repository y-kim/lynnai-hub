name: lynnai-hub
# 화면 구성(vid): 기기 목록·팝업에는 짧은 글(boilerStatus), 상세 화면 "상태" 칸에는 까닭까지 적은 글(roomStatus).
# 원본은 presentations/lynnai-hub.device-config.json. 구역·capability 를 바꾸면 그 파일을 고쳐
# presentation:device-config:create 로 다시 만들고 vid 를 바꾼다.
metadata:
  mnmn: SmartThingsCommunity
  vid: af28d441-078c-3126-bbcb-c32f4a216232
components:
  - id: main
    label: LYNNAI 허브
    capabilities:
      - id: connectbook02461.boilerStatus   # 기기 목록 글: 프록시 모드 / 단독 모드 / 임시 단독 모드
        version: 1
        optional: true
      - id: connectbook02461.roomStatus     # 상세 화면 글: … / 단독 모드 (18:25부터 린나이 서버 접속 불가)
        version: 1
        optional: true
      - id: mode                # 동작 모드: 프록시 / 단독 (허브가 알려 줄 때 채워진다, CMD 0x0b)
        version: 1
        optional: true
      - id: refresh
        version: 1
    categories:
      - name: Hub
  - id: chip
    label: 허브 내부 온도
    capabilities:
      - id: temperatureMeasurement
        version: 1
        optional: true          # 허브 칩 온도(방 온도 아님) — 노출 설정(비트 11)에서 켜면 이 하위 상태로만 보임
