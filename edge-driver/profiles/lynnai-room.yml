name: lynnai-room
# 온습도계. 범주 TempHumiditySensor = 온도·습도 아이콘. 화면 구성(vid)은 기기 카드·맵뷰 팝업에 온도와 습도를 같이
# 보이게 한 것(기본 구성은 온도만 보인다) — 원본은 presentations/lynnai-room.device-config.json.
# capability 를 바꾸면 그 파일을 고쳐 presentation:device-config:create 로 다시 만들고 vid 를 바꾼다.
metadata:
  mnmn: SmartThingsCommunity
  vid: ec60c173-0812-30fb-89f5-342a8e815069
components:
  - id: main
    capabilities:
      - id: temperatureMeasurement
        version: 1
      - id: relativeHumidityMeasurement
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: TempHumiditySensor
