name: lynnai-zone
# 화면 구성(vid): 글자 요약(roomStatus, "21°C · 난방 23°C")은 팝업·기기 카드에만 쓰고 상세 화면에서는 뺐다.
# 표준 온도 카드의 제목 "온도"를 "실내 온도"로 바꿨다(patch /0/label).
# 원본은 presentations/lynnai-zone.device-config.json. 구역·capability 나 그 표시를 바꾸면
# presentation:device-config:create 로 다시 만들고 vid 를 바꾼다.
metadata:
  mnmn: SmartThingsCommunity
  vid: e657fec8-bfa8-3942-9cb8-0083a846b9ce
# optional: true 인 것은 허브 관리 화면에서 숨길 수 있다
components:
  - id: main
    label: 난방
    capabilities:
      - id: connectbook02461.roomStatus
        version: 1
      - id: switch
        version: 1
        optional: true
      - id: temperatureMeasurement
        version: 1
      - id: thermostatHeatingSetpoint
        version: 1
        optional: true
      - id: refresh
        version: 1
    categories:
      - name: Thermostat
  - id: outing
    label: 외출
    capabilities:
      - id: switch
        version: 1
        optional: true
  - id: reserve
    label: 예약
    capabilities:
      - id: switch
        version: 1
        optional: true
      - id: connectbook02461.reserveHours   # 예약 시간(1~24시간) 슬라이더
        version: 1
        optional: true
