name: lynnai-zone
# optional: true 인 것은 허브 관리 화면에서 숨길 수 있다
components:
  - id: main
    capabilities:
      - id: connectbook02461.roomStatus
        version: 1
      - id: switch
        version: 1
        optional: true
      - id: temperatureMeasurement
        version: 1
      - id: thermostatHeatingSetpoint
        version: 1
        optional: true
      - id: refresh
        version: 1
    categories:
      - name: Thermostat
  - id: outing
    label: 외출
    capabilities:
      - id: switch
        version: 1
        optional: true
  - id: reserve
    label: 예약
    capabilities:
      - id: switch
        version: 1
        optional: true
      - id: mode               # 예약 간격(30분, 1~24시간)
        version: 1
        optional: true
