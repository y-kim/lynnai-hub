<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 654" width="360" role="img" aria-label="SmartThings 기기 목록 화면 그림: 거실·안방·서재에 각방 온도조절기(현재 온도와 난방·예약·꺼짐 상태), 거실에 SmartThings Station, 다용도실에 LYNNAI Hub, 보일러 컨트롤러(온돌 75도 · 온수 60도), 가스 계량기(1D · 1H 사용량), 온습도계">
  <title>SmartThings 기기 목록 화면 그림: 거실·안방·서재에 각방 온도조절기(현재 온도와 난방·예약·꺼짐 상태), 거실에 SmartThings Station, 다용도실에 LYNNAI Hub, 보일러 컨트롤러(온돌 75도 · 온수 60도), 가스 계량기(1D · 1H 사용량), 온습도계</title>
  <style>
    .screen { fill: #f1f1f4; stroke: #d5d8de; }
