<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 660" width="360" role="img" aria-label="각방 온도조절기의 SmartThings 화면 그림: 난방 켜짐, 실내 온도 21도, 난방 온도 설정 23도. 외출 꺼짐. 예약 꺼짐, 예약 시간 5시간">
  <title>각방 온도조절기의 SmartThings 화면 그림: 난방 켜짐, 실내 온도 21도, 난방 온도 설정 23도. 외출 꺼짐. 예약 꺼짐, 예약 시간 5시간</title>
  <style>
    .screen { fill: #f1f1f4; stroke: #d5d8de; }
    .card   { fill: #fcfcfd; }
    .idle   { fill: #e4e4e7; }
    .on     { fill: #3f83f1; }
    .btn    { fill: #f4f4f6; }
    .btn-on { fill: #ffffff; }
    .rule   { stroke: #e3e5ea; stroke-width: 1; }
    .track  { stroke: #e2e3e7; stroke-width: 6; stroke-linecap: round; }
    .heat   { stroke: #dc3b36; stroke-width: 6; stroke-linecap: round; }
    .cool   { stroke: #3f83f1; stroke-width: 6; stroke-linecap: round; }
    .knob-h { fill: #dc3b36; }
    .knob-c { fill: #3f83f1; }
    .dim    { opacity: .35; }
    .ink    { fill: #14161a; }
    .muted  { fill: #6b7078; }
    .icon   { fill: none; stroke: #14161a; stroke-width: 2; stroke-linecap: round; }
    .icon-m { fill: #6b7078; }
    text    { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #14161a; }
    .t-title { font-size: 17px; font-weight: 700; }
    .t-sub   { font-size: 12.5px; fill: #6b7078; }
    .t-sec   { font-size: 13px; fill: #6b7078; }
    .t-name  { font-size: 14.5px; }
    .t-val   { font-size: 22px; font-weight: 700; }
    .t-unit  { font-size: 14px; font-weight: 600; }
    .t-pill  { font-size: 21px; font-weight: 700; }
    .t-on    { fill: #ffffff; }
    .t-pm    { font-size: 15px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .t-col   { font-size: 11.5px; text-anchor: middle; }
    .t-cval  { font-size: 19px; font-weight: 700; text-anchor: middle; }
    .t-cunit { font-size: 12px; font-weight: 600; }
    .g1 { stop-color: #ebe8fb; } .g2 { stop-color: #cfe1f8; } .g3 { stop-color: #dcdbee; }
    .edge    { fill: none; stroke: #d5d8de; }
    .ic-box  { fill: #3d4046; }
    .ic-yel  { fill: #f5c518; }
    .ic-off  { fill: #b9bdc6; }
    .ic-grn  { fill: none; stroke: #86d993; stroke-width: 1.800; stroke-linecap: round; }
    .t-dev   { font-size: 14px; font-weight: 700; }
    .t-st    { font-size: 12.5px; fill: #6b7078; }
    .t-tab   { font-size: 14.5px; fill: #6b7078; }
    .t-tab-on { font-size: 14.5px; font-weight: 700; }
    .off-card { opacity: .55; }
    @media (prefers-color-scheme: dark) {
      .screen { fill: #000000; stroke: #33363c; }
      .card   { fill: #1c1d21; }
      .idle   { fill: #2a2b30; }
      .on     { fill: #3a78dc; }
      .btn    { fill: #3a3c42; }
      .rule   { stroke: #2c2e33; }
      .track  { stroke: #3a3d44; }
      .heat   { stroke: #e0524d; }
      .cool   { stroke: #3a78dc; }
      .knob-h { fill: #e0524d; }
      .knob-c { fill: #3a78dc; }
      .icon   { stroke: #f2f3f5; }
      .icon-m { fill: #9aa0a8; }
      text    { fill: #f2f3f5; }
      .t-sub, .t-sec, .t-st, .t-tab { fill: #9aa0a8; }
      .g1 { stop-color: #1b1a2b; } .g2 { stop-color: #14202e; } .g3 { stop-color: #1a1a24; }
      .edge   { stroke: #33363c; }
      .ic-box { fill: #4a4d55; }
    }
  </style>
  <rect class="screen" x="0.5" y="0.5" width="359" height="659" rx="26"/>
  <text class="t-title" x="48" y="34">각방 온도조절기</text>
  <text class="t-sub" x="48" y="52">집 - 거실</text>
  <path class="icon" d="M28 30 l-7 8 l7 8"/>
  <text class="t-sec" x="22" y="88">난방</text>
  <path class="icon-m" transform="translate(326 76)" d="M0 11.500V14h2.500l7.400-7.400-2.500-2.500L0 11.500Zm11.800-6.800a.660.660 0 0 0 0-.900L10.200 2.200a.660.660 0 0 0-.900 0L8.100 3.400l2.500 2.500 1.200-1.200Z"/>
  <rect class="on" x="14" y="100" width="332" height="56" rx="28"/>
  <text class="t-pill t-on" x="36" y="135">켜짐</text>
  <circle class="btn-on" cx="316" cy="128" r="19"/>
  <path class="icon" style="stroke:#14161a" d="M316 120v8M311.2 122.8a7 7 0 1 0 9.600 0"/>
  <rect class="card" x="14" y="166" width="332" height="74" rx="22"/>
  <text class="t-name" x="34" y="193">실내 온도</text>
  <text class="t-val" x="34" y="223">21.0</text><text class="t-unit" x="91" y="223">°C</text>
  <g class="icon-m" transform="translate(308 180)"><rect x="0" y="6" width="3" height="9" rx="1"/><rect x="5" y="0" width="3" height="15" rx="1"/><rect x="10" y="4" width="3" height="11" rx="1"/><rect x="15" y="7" width="3" height="8" rx="1"/></g>
  <rect class="card" x="14" y="250" width="332" height="108" rx="22"/>
  <text class="t-name" x="34" y="277">난방 온도 설정</text>
  <text class="t-val" x="34" y="307">23.0</text><text class="t-unit" x="91" y="307">°C</text>
  <circle class="knob-h" cx="44" cy="334" r="10"/><text class="t-pm" x="44" y="339">−</text>
  <path class="track" d="M64 334H296"/><path class="heat" d="M64 334H215"/><circle class="knob-h" cx="215" cy="334" r="12"/>
  <g class=""><circle class="knob-h" cx="316" cy="334" r="10"/><text class="t-pm" x="316" y="339">+</text></g>
  <text class="t-sec" x="22" y="386">외출</text>
  <path class="icon-m" transform="translate(326 374)" d="M0 11.500V14h2.500l7.400-7.400-2.500-2.500L0 11.500Zm11.800-6.800a.660.660 0 0 0 0-.900L10.200 2.200a.660.660 0 0 0-.900 0L8.100 3.400l2.500 2.500 1.200-1.200Z"/>
  <rect class="idle" x="14" y="398" width="332" height="56" rx="28"/>
  <text class="t-pill" x="36" y="433">꺼짐</text>
  <circle class="btn" cx="316" cy="426" r="19"/>
  <path class="icon" d="M316 418v8M311.2 420.8a7 7 0 1 0 9.600 0"/>
  <text class="t-sec" x="22" y="482">예약</text>
  <path class="icon-m" transform="translate(326 470)" d="M0 11.500V14h2.500l7.400-7.400-2.500-2.500L0 11.500Zm11.800-6.800a.660.660 0 0 0 0-.900L10.200 2.200a.660.660 0 0 0-.900 0L8.100 3.400l2.500 2.500 1.200-1.200Z"/>
  <rect class="idle" x="14" y="494" width="332" height="56" rx="28"/>
  <text class="t-pill" x="36" y="529">꺼짐</text>
  <circle class="btn" cx="316" cy="522" r="19"/>
  <path class="icon" d="M316 514v8M311.2 516.8a7 7 0 1 0 9.600 0"/>
  <rect class="card" x="14" y="560" width="332" height="78" rx="22"/>
  <text class="t-name" x="34" y="587">예약 시간</text>
  <text class="t-val" x="34" y="619">5</text><text class="t-unit" x="55" y="619">시간</text>
  <path class="track" d="M130 611H318"/><path class="cool" d="M130 611H162"/><circle class="knob-c" cx="162" cy="611" r="12"/>
</svg>
