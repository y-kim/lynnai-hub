# lynnai-hub-watch 단독 실행 예 (NAS 등). HUB_TOKEN 은 허브 관리 화면 → 서버 연동에서 만든 토큰.
services:
  lynnai-hub-watch:
    build: .
    container_name: lynnai-hub-watch
    restart: unless-stopped
    init: true                  # PID 1 은 tini — SIGTERM 을 파이썬에 넘겨 docker stop 이 바로 끝나게
    environment:
      - HUB_URL=${HUB_URL:?HUB_URL(허브 주소, 예 http://192.168.0.50)을 .env 에}
      - HUB_TOKEN=${HUB_TOKEN:-}
      - POLL_SEC=60
      - EVENT_SEC=30
    volumes:
      - ./data:/data
