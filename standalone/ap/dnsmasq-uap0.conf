# dnsmasq -- uap0 전용 DHCP만. (DNS는 우리 dns_hijack.py가 53에서 담당)
# dnsmasq의 DNS는 끄고 DHCP만 쓴다: 우리 파이썬 DNS를 Pico로 포팅하려고.
interface=uap0
bind-interfaces
except-interface=wlan0        # 집WiFi쪽 간섭 금지 (SSH 보호)

# DNS 비활성 (port=0) — 53은 dns_hijack.py가 잡음
port=0

# DHCP
dhcp-range=192.168.50.50,192.168.50.150,255.255.255.0,12h
dhcp-option=3,192.168.50.1    # gateway = uap0
dhcp-option=6,192.168.50.1    # DNS server = uap0 (우리 하이재커로 유도)
