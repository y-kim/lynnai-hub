# hostapd.conf -- Pi3 가상 AP (uap0). wlan0 STA(집WiFi/SSH)와 동시 운용.
# ★ channel은 wlan0가 붙은 공유기 채널과 "반드시 동일"해야 함 (brcmfmac 제약).
#   확인: iw dev wlan0 link | grep freq  → 2412=1ch, 2437=6ch, 2462=11ch ...
interface=uap0
driver=nl80211

ssid=rkiot-test
hw_mode=g
channel=6
# ↑ 집 공유기 채널로 바꿀 것

auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=rkiot12345
# ↑ 보일러 페어링 시 입력할 비번

# 보일러가 2.4GHz만 지원하므로 g모드 유지
ignore_broadcast_ssid=0
